
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Algoritmo Genético</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Simulador de Algoritmo Genético</h1>
        <p>Seleção de projetos com orçamento limitado</p>
    </header>

    <main>
        <section>
            <h2>Projetos disponíveis</h2>

            <p>
                Projetos que poderão ser selecionados
                pelo algoritmo genético.
            </p>

            <table>
                <thead>
                    <tr>
                        <th>Projeto</th>
                        <th>Custo</th>
                        <th>Benefício</th>
                    </tr>
                </thead>

                <tbody id="tabelaProjetos"></tbody>
            </table>
        </section>

        <section>
            <h2>Orçamento disponível</h2>
            <p id="orcamento"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
